<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Beating in Sync</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module" src="/static/js/main.js"></script>
  </head>
  <body>
    <header class="shell__header">
      <a href="#/menu" class="shell__brand" aria-label="Main menu">
        <span class="shell__pulse" data-component="pulse-dot" aria-hidden="true"></span>
        <span>Beating in Sync</span>
      </a>
      <nav class="crumbs" data-component="crumbs" aria-label="You are here"></nav>
      <div class="shell__right">
        <a href="#/check" class="status-pills" data-component="status" title="Setup status: open the setup checklist"></a>
        <label class="debug-toggle" title="Show the technical panels (sensor signals, Director reasoning, simulators)">
          <input type="checkbox" data-component="debug" />
          <span class="switch__ui" aria-hidden="true"></span>
          <span>Debug</span>
        </label>
      </div>
    </header>
    <main id="view-outlet" class="shell__outlet"></main>
    <div class="wipe" aria-hidden="true"><span></span><span></span><span></span></div>
  </body>
</html>
